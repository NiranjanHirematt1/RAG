[project]
name = "rag"
version = "0.1.0"
description = "DocuMind: RAG over PDFs with Groq + Qdrant + Streamlit"
readme = "README.md"
authors = [
    { name = "NiranjanHirematt1", email = "hiremattniranjan@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "groq>=0.11.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

# CPU-only PyTorch on Linux/Windows. The default PyPI build bundles CUDA
# (~3 GB of nvidia-* wheels), which Streamlit Community Cloud can't handle.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
